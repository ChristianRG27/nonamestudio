name: Deploy dev to Vercel

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: vercel-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Vercel credentials
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID secret'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID secret'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret'; exit 1; }
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --git-branch=dev --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
