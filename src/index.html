    <!-- Transición entre páginas (View Transitions API). Va aquí porque el
         minificador del build descarta los pseudo-elementos ::view-transition-*. -->
    <style>
      @media (prefers-reduced-motion: no-preference) {
        ::view-transition-old(root) {
          animation: pagina-salir 520ms cubic-bezier(0.4, 0, 1, 1) both !important;
          mix-blend-mode: normal !important;
          opacity: 1 !important;
        }

        ::view-transition-new(root) {
          animation: pagina-entrar 520ms cubic-bezier(0.16, 1, 0.3, 1) both !important;
          mix-blend-mode: normal !important;
          opacity: 1 !important;
        }

        html.nav-atras::view-transition-old(root) {
          animation: pagina-salir-atras 520ms cubic-bezier(0.4, 0, 1, 1) both !important;
          mix-blend-mode: normal !important;
          opacity: 1 !important;
        }

        html.nav-atras::view-transition-new(root) {
          animation: pagina-entrar-atras 520ms cubic-bezier(0.16, 1, 0.3, 1) both !important;
          mix-blend-mode: normal !important;
          opacity: 1 !important;
        }
      }

      /* Las dos capas se comportan como páginas opacas, sin mezcla aditiva. */
      ::view-transition-image-pair(root) {
        isolation: isolate !important;
      }

      ::view-transition-group(cabecera-fija),
      ::view-transition-group(cta-fijo),
      ::view-transition-group(cookies-fijo) {
        mix-blend-mode: normal !important;
        animation: none !important;
      }

      @keyframes pagina-salir {
        to {
          transform: translateX(-16%);
        }
      }

      @keyframes pagina-entrar {
        from {
          transform: translateX(100%);
        }
      }

      @keyframes pagina-salir-atras {
        to {
          transform: translateX(16%);
        }
      }

      @keyframes pagina-entrar-atras {
        from {
          transform: translateX(-100%);
        }
      }

      ::view-transition-group(cabecera-fija),
      ::view-transition-group(cta-fijo),
      ::view-transition-group(cookies-fijo),
      ::view-transition-old(cabecera-fija),
      ::view-transition-old(cta-fijo),
      ::view-transition-old(cookies-fijo) {
        animation: none;
      }

      ::view-transition-new(cabecera-fija),
      ::view-transition-new(cta-fijo),
      ::view-transition-new(cookies-fijo) {
        animation: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
